# Perfil para testes visuais: não usa Oracle nem executa migrations.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.flyway.enabled=false

# Chaves efêmeras apenas para a sessão local. Não usar este perfil em produção.
jwt.secret=fordretain-local-jwt-secret-at-least-32-characters
jwt.expiration=86400000
app.crypto.secret=fordretain-local-crypto-secret
app.crypto.salt=fordretain-local-salt

firebase.enabled=false
